[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepy-lm"
version = "0.1.0"
description = "Tiered sleep consolidation for language models: episodic buffer, rank-ladder adapters, gated base merges"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["continual-learning", "lora", "consolidation", "catastrophic-forgetting", "plasticity-loss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sleepy-demo = "sleepy.demo:main"

[tool.setuptools]
packages = ["sleepy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
